name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk dijital-ikiz.apk

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: dijital-ikiz-apk
          path: dijital-ikiz.apk

      - name: Releases sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dijital İkiz - son derleme
          files: dijital-ikiz.apk
